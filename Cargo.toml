[workspace]
members = ["cyoa-core", "cyoa-application", "cyoa-infrastructure", "cyoa-presentation", "cyoa-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
indexmap = "2.14"
cyoa-core = { path = "cyoa-core" }
cyoa-application = { path = "cyoa-application" }
cyoa-infrastructure = { path = "cyoa-infrastructure" }
cyoa-presentation = { path = "cyoa-presentation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
