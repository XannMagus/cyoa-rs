name: Rust

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pinned domain mutation tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.132
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check required project contracts, tests, and architecture
        run: bash scripts/check_contracts.sh
      - name: Retain domain mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-mutations
          path: mutants.out/
          if-no-files-found: ignore
