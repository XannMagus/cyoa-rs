[package]
name = "cyoa-cli"
description = "Terminal frontend for cyoa-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cyoa"
path = "src/main.rs"

[dependencies]
cyoa-application.workspace = true
cyoa-infrastructure.workspace = true
cyoa-presentation.workspace = true
cyoa-core.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
escargot = "0.5"
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
