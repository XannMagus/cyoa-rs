# The prompts actually loaded by cyoa-infrastructure. Adapted from
# reference/prompts.toml (the honest verbatim capture of calibre's
# provider-agnostic originals): verified to already contain no
# "respond with only valid JSON"-style directive (see 01-claude-cli.md's
# "Gotcha" section for why one would be a problem with --json-schema), and
# one line added that reference/prompts.toml does not have —
# `turn.rule_field_order` — asking the model to emit fields in schema order,
# since we don't get that for free the way calibre does from Python field
# order (PLAN.md's "Strip JSON directives" note).
#
# {{ placeholders }} are minijinja variables, rendered with `UndefinedBehavior::Strict`.

version = 1

[fragments]
designer_role = "You are a creative designer of interactive \"choose your own adventure\" fiction."

# markdown_instructions(what) — cyoa.py:903-911
# Usage in original: markdown_instructions('the world description'),
# markdown_instructions('all descriptive text fields (character descriptions, backstories and relationships)'),
# markdown_instructions('all narrative and descriptive text')
markdown = """Format {{ what }} using Markdown: use **bold** for emphasis and important moments, *italics* for atmosphere and inner thoughts, and blank lines to separate paragraphs. Do not use headers or bullet lists."""

# --- World generation (LLM call #1) --- cyoa.py:914-926

designer_role_ref = "see fragments.designer_role"

[world]
# WORLD_GENERATION_INSTRUCTIONS, cyoa.py:916-922 (fully rendered):
instructions = """You are a creative designer of interactive "choose your own adventure" fiction. Given a brief description of a world, flesh it out into a rich, internally consistent game world, inventing concrete details: places, factions, conflicts and atmosphere. Write about the world itself, not about any of the people in it: the characters of the story are created separately, once the player is happy with the world. Format the world description using Markdown: use **bold** for emphasis and important moments, *italics* for atmosphere and inner thoughts, and blank lines to separate paragraphs. Do not use headers or bullet lists."""

# world_generation_prompt(brief), cyoa.py:925-926
prompt = "Create the world for an adventure game based on this description:\n\n{{ brief }}"

# --- Cast generation (LLM call #2) --- cyoa.py:929-954

[cast]
# CAST_GENERATION_INSTRUCTIONS, cyoa.py:929-945. {{ max_generated_npcs }} = 8.
instructions = """You are a creative designer of interactive "choose your own adventure" fiction. Given the world of an adventure game, invent the cast of characters for it. Create between {{ min_generated_playables }} and {{ max_generated_playables }} distinct playable characters, each with a different perspective on the world's central conflict. If the world description mentions a central character, then have the playable characters all be variants of that person with different descriptions and back stories. {% if max_generated_npcs == 0 %}Create no NPCs; return an empty npcs list.{% else %}Create between {{ min_generated_npcs }} and {{ max_generated_npcs }} other characters who live in this world and whom the player will meet as the story unfolds: allies, rivals, authorities, and ordinary people caught up in the conflict. These must work as characters the story can use whichever of the playable characters the player chooses, so do not make any of them a duplicate of a playable character. {% endif %}Include physical descriptions and a little back story for every character. Make each character's physical description detailed enough to be used, as a prompt for an image generation AI: cover their appearance, age and distinguishing features without relying on the rest of the world description. Describe the kind of clothes the character typically wears but not an individual outfit, let the image generation AI choose that. Format all descriptive text fields (character descriptions, backstories and relationships) using Markdown: use **bold** for emphasis and important moments, *italics* for atmosphere and inner thoughts, and blank lines to separate paragraphs. Do not use headers or bullet lists."""

# cast_generation_prompt(brief, world), cyoa.py:948-954
prompt = """Create the cast of characters for an adventure game set in this world:

# {{ world.title }}

{{ world.world_description }}

The player described the world they wanted as: {{ brief }}"""

# --- Quick action kinds --- cyoa.py:264-309, 282-297

[quick_actions]
# REQUESTED_QUICK_ACTION_KINDS, cyoa.py:293-297 — one action per group, in
# order. Must precede the [[quick_actions.kinds]] array-of-tables below:
# TOML attaches trailing `key = value` lines to the last opened array-of-tables
# entry, not back to [quick_actions], if they come after it.
requested = [["cautious"], ["bold"], ["social", "investigate"]]

# QUICK_ACTION_KIND_DESCRIPTIONS, cyoa.py:282-288
[[quick_actions.kinds]]
key = "cautious"
label = "Cautious"
meaning = "hold back, defend, hide, retreat, prepare or take the careful option"

[[quick_actions.kinds]]
key = "bold"
label = "Bold"
meaning = "act directly and decisively: confront someone, force the issue or take the physical risk"

[[quick_actions.kinds]]
key = "social"
label = "Social"
meaning = "engage another character: persuade, deceive, plead, bargain, provoke or simply ask"

[[quick_actions.kinds]]
key = "investigate"
label = "Investigate"
meaning = "find something out: look closer, search, follow, eavesdrop or examine"

[[quick_actions.kinds]]
key = "other"
label = ""
meaning = "an action that fits none of the other kinds"

# --- Prose contract (style-dependent, see styles.toml) --- cyoa.py:984-1004
# prose_contract(style) assembles, space-joined:
#   1. PACES[style.pace].prompt
#   2. f'Write it {NARRATION_STYLES[style.narration].prompt}, and keep to that throughout.'
#   3. TONES[style.tone].prompt   (omitted entirely if empty — the "default" tone)
#   4. the fixed dialogue/sensory sentence below
#   5. markdown_instructions('all narrative and descriptive text')

[prose_contract]
dialogue_and_sensory = """Bring the characters to life with spoken dialogue, quoting their words directly in their own distinct voices, and show their expressions, gestures, body language and emotional reactions as they speak and act. When the story enters a new location or the mood shifts, ground the scene with sensory detail: sights, sounds, smells and atmosphere."""

# Fully rendered example for ALL-DEFAULTS style (pace=long, narration=second-present, tone=default):
example_all_defaults = """Write each passage as rich long form fiction of several substantial paragraphs, typically 400-800 words, the way a skilled novelist would: let scenes breathe and unfold rather than summarizing events. Write it in second person present tense, addressing the reader as "you", and keep to that throughout. Bring the characters to life with spoken dialogue, quoting their words directly in their own distinct voices, and show their expressions, gestures, body language and emotional reactions as they speak and act. When the story enters a new location or the mood shifts, ground the scene with sensory detail: sights, sounds, smells and atmosphere. Format all narrative and descriptive text using Markdown: use **bold** for emphasis and important moments, *italics* for atmosphere and inner thoughts, and blank lines to separate paragraphs. Do not use headers or bullet lists."""

# --- Turn instructions (system prompt, every turn) --- cyoa.py:1007-1078
# turn_instructions(state) assembles these parts, joined by '\n':

[turn]
role = """You are a novelist writing an interactive novel in collaboration with your reader. You write the novel's prose; the reader directs the actions of the protagonist, {{ protagonist.name }}, between passages. Write the next passage based on the story summary, the prose of the current chapter so far and the reader's latest direction. Each passage you write must continue seamlessly from exactly where the previous passage ended, as if it were the next paragraphs of the same chapter. Never repeat, summarize or rephrase prose that has already been written: the reader has just read it. Have the characters react to the protagonist's actions and the world in realistic and consistent ways."""

# then: prose_contract(state.style)  — see [prose_contract] above
# then literal: "Rules for the fields of your response:"

rule_narrative = """- narrative: the next passage of the novel, written to the contract for the prose given above. It must pick up exactly where the chapter's prose left off, without repeating or recapping anything already written. Weave together action, dialogue from the characters, their expressions and reactions, and scene description where needed, never a terse summary of events. End at a point where the reader must decide what the protagonist does next."""

# then: quick_actions.rendered_instructions above

rule_scene_description = """- scene_description: a self-contained visual description of the current scene for an image generation AI. It must make sense without any knowledge of the story."""

rule_summary_update = """- summary_update: how this passage changes the story summary, which is your only memory of everything that happened before the current chapter. Send only what changed. Every field you leave empty keeps the value it already has in the summary, so there is never any need to copy text out of the summary and back."""

rule_character_updates = """- character_updates: one entry for every character this passage changes, and one for every new named character it introduces. Leave out the characters the passage does not touch. Fill in current_state, which is everything that is only true of them right now: where they are, what they are doing, their physical condition and injuries, their mood, what they carry and what they intend next. Leave description, backstory and relationships empty unless this passage changed them: description only when their appearance or nature has permanently changed, backstory only when the story reveals something new about their past, relationships only when how they stand with someone has shifted. Never put events, mood, injuries or location into description, which is also used as the prompt to draw them. A character you are introducing needs a name, a short description and a brief backstory as well as their current state."""

rule_character_ids = """- Each entry of character_updates names its character by id, which is that character's permanent identity, not their name. Reproduce the id from the summary verbatim, even when you rename them: when "the stranger" turns out to be Marlo, put the new name in name and leave the id untouched. Never change, swap or re-use an id and never send two entries for the same character. Invent a new short lowercase id, based on their name, only for a character you are adding to the summary for the first time."""

# {{ max_major_events }} = 30
rule_new_major_events = """- new_major_events: the events of this passage that matter to the rest of the story, one short line each. They are added to the major events already in the summary, so never repeat one that is already there, and leave the field empty when nothing of lasting importance happened. The summary holds at most {{ max_major_events }} major events: as it nears that many, use consolidated_major_events to replace the events already in the summary with a shorter list that merges the older ones into single lines."""

rule_upcoming_events = """- upcoming_events: null on most passages. Leave it null unless this passage opens a new unresolved plot thread or resolves one the summary already holds. When one of them does change, this is the one field that replaces rather than adds to what the summary holds: give the whole list of unresolved threads as it now stands, repeating those still open and dropping those this passage resolved, or an empty list when it resolved the last of them."""

rule_current_situation = "- current_situation: where the protagonist is and what is happening as this passage ends."

rule_starts_new_chapter = "- starts_new_chapter: true only when this passage begins a major new phase of the story, with chapter_title naming the new chapter. On a continuing passage, chapter_title may retitle the current chapter; null keeps its existing title."

# Not in reference/prompts.toml: calibre gets field order for free from Python
# NamedTuple field order; --json-schema needs to be told (PLAN.md).
rule_field_order = "Emit the fields of the JSON object in the order they appear in the schema."

# then blank line, then:
#   f"The world, titled {w.title!r}, is described as:"   <- Python repr(), i.e. single-quoted
#   w.world_description
#   ""
#   f"The protagonist, {c.name}, is {c.description}"
#   c.backstory
world_and_protagonist_template = """
The world, titled '{{ world.title }}', is described as:
{{ world.world_description }}

The protagonist, {{ protagonist.name }}, is {{ protagonist.description }}
{{ protagonist.backstory }}"""

# --- Turn prompt (user message, every turn) --- cyoa.py:1081-1127
# turn_prompt(state, player_input, interesting_event) — real control flow,
# ported as a minijinja template with these branches. See PLAN.md's
# "TOML prompt externalization" section for the full templated version;
# the branch logic below is transcribed directly from the Python so nothing
# is lost in translation.

[turn.prompt_parts]
summary_header = "The summary of the story so far, as JSON:"
# then: json.dumps(summary, indent=2), then a blank line

bridge_header = "The closing prose of the previous chapter, for continuity. The reader has read it and the story has moved past it:"
# then blank line, then each bridge turn's prose (with "[The reader directs: ...]" markers
# for turns that had player input), each followed by a blank line

transcript_header = "The prose of the current chapter so far, which the reader has already read:"
# then blank line, then each current-chapter turn's prose, same marker format

interesting_event_prompt = "The reader waits to see what happens next. Have something unexpected and interesting happen, taking the story in a surprising new direction."

interesting_event_with_threads_header = "Do it, if you can, by paying off one of these unresolved threads from upcoming_events, bringing it to the surface now rather than leaving it for later:"
# then: "- {{ thread }}" for each thread in state.current_summary.upcoming_events

interesting_event_fallback = "Invent something unrelated only if none of them can plausibly surface in this moment."

player_directs = "The reader directs: {{ player_input }}"
player_no_direction = "The reader offers no direction."

continue_seamlessly = "Write the next passage of the novel, continuing seamlessly from where the chapter's prose ends."

# Only when state.turns is EMPTY (the opening turn):
opening_with_input = "The reader asks for the novel to begin as follows: {{ player_input }}"
opening_instruction = "Begin the novel with an opening scene that introduces the protagonist and their situation."

[premade_worlds]
# The starter world briefs offered on the brief screen (world.py:85+).
# Deliberately untranslated/English in the original — "AI models work best
# with English instructions" (comment at world.py:83).
[[premade_worlds.entries]]
title = "Epic fantasy"
art_style = "digital-painting"
tone = "heroic"
brief = "A vast high fantasy realm of warring kingdoms, ancient forests and forgotten ruins. An ancient prophecy is stirring, dragons have been sighted for the first time in centuries, and a darkness gathers in the north while the great houses squabble over a fractured throne."

[[premade_worlds.entries]]
title = "Space opera"
art_style = "digital-painting"
tone = "heroic"
brief = "A far future galaxy dominated by a decaying stellar empire and a scrappy rebel alliance. Faster-than-light travel runs on mysterious alien artifacts nobody fully understands, and a newly discovered artifact at the galactic rim could change the balance of power forever."

[[premade_worlds.entries]]
title = "Cyberpunk noir"
art_style = "anime"
tone = "grimdark"
brief = "A rain-soaked megacity of neon, chrome and corporate arcologies, where AIs pull strings from the shadows and memories can be bought and sold. Street-level hustlers, jaded detectives and rogue programs all chase the same secret buried in the city's oldest network."

[[premade_worlds.entries]]
title = "Post-apocalyptic survival"
art_style = "photorealistic"
tone = "grimdark"
brief = "A century after civilization collapsed, scattered settlements cling to life amid ruined cities, toxic zones and mutated wilderness. Water and fuel are currency, raiders prowl the old highways, and rumors spread of a pre-collapse vault that could restore the world."

[[premade_worlds.entries]]
title = "Pirate adventure"
art_style = "comic"
tone = "heroic"
brief = "The golden age of piracy on a chain of tropical islands, with treasure fleets, naval patrols, smuggler coves and legends of cursed gold. A recently surfaced map promises the hoard of a legendary pirate king, and every crew in the islands wants it."

[[premade_worlds.entries]]
title = "Gothic horror"
art_style = "noir"
tone = "grimdark"
brief = "A remote Victorian estate on the windswept moors, full of locked rooms, family secrets and things that walk at night. The new heir has just arrived to claim an inheritance that the villagers whisper is cursed, and the house itself seems to be watching."

[[premade_worlds.entries]]
title = "Murder mystery"
art_style = "noir"
tone = ""  # left to the AI in the original
brief = "A snowbound 1920s country house party where the host is found dead on the first night. Every guest has a motive, the telephone lines are down, and the killer must be found before the snow melts and they slip away."

[[premade_worlds.entries]]
title = "Wild West"
art_style = "photorealistic"
tone = ""
brief = "A dusty frontier town at the edge of the gold fields, caught between a ruthless cattle baron, a crooked railroad company and the last honest lawman. Fortunes are made and lost overnight, and every stranger riding in brings trouble with them."

[[premade_worlds.entries]]
title = "Greek mythology"
art_style = "digital-painting"
tone = "heroic"
brief = "The age of heroes in mythic Greece, where the gods of Olympus meddle in mortal affairs, monsters haunt the wine-dark sea and glory is won through impossible quests. An oracle has spoken of a deed that could earn a mortal a place among the stars."

[[premade_worlds.entries]]
title = "Abbasid Caliphate"
art_style = "digital-painting"
tone = ""
brief = "Baghdad at the height of the Abbasid Caliphate, the glittering heart of the Islamic Golden Age: bustling bazaars, the scholars of the House of Wisdom, caravans on the Silk Road and palace intrigue in the court of the Caliph. A famed treatise has vanished from the House of Wisdom, and whispers in the souk say its loss conceals a plot against the throne."

[[premade_worlds.entries]]
title = "Regency intrigue"
art_style = "watercolor"
tone = "romance"
brief = "London high society at the height of the Regency era: glittering balls, arranged marriages, ruinous gossip and fortunes won at the card table. Beneath the polished manners, a scandal is brewing that could topple one of the great families."

