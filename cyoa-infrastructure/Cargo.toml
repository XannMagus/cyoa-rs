[package]
name = "cyoa-infrastructure"
description = "External adapters for CYOA"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cyoa-application.workspace = true
cyoa-core.workspace = true
minijinja = "2.24.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1.6"

# Test-support subprocess used by this crate's own integration tests (and, via
# escargot, by cyoa-cli's binary tests) to exercise the real process boundary
# without an installed vendor CLI. Never wired into the shipped command surface.
[[bin]]
name = "subprocess_fixture"
path = "src/bin/subprocess_fixture.rs"

[lints]
workspace = true
